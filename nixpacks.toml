[phases.setup]
nixPkgs = [
    "php84",                  # <--- CHANGED from default php or php82
    "php84Packages.composer", # <--- Ensure composer matches the PHP version
    "nginx",                  # <-- ADDED (Required, because we removed the defaults)
    "python311Packages.supervisor",
    "nodejs_22",               # Ensure you have node if you removed "..."
    "jdk",
]

[phases.install]
cmds = [
    "php -v && php --ini",
    "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction",
    "npm i --no-audit --no-fund --loglevel=error",
]

[phases.build]
cmds = [
    # Cache configs for prod
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",

    # Frontend builds (command will run client + SSR)
    "npm run build:ssr",

    # supervisor/nginx assets
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh"
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash
set -e

# --- The image renderer's Node interpreter (App\Support\TakumiRenderer runs
# scripts/takumi-render.mjs). Resolved through readlink -f to the real Nix store
# path so PHP-FPM, which does not inherit root's PATH, can execute it; the
# `php artisan optimize` below bakes it into the cached config.
export NODE_BINARY=$(readlink -f "$(which node)")

# --- ensure Laravel writable paths (volume may be empty on first boot)
mkdir -p /app/storage/framework/{cache,sessions,views} \
         /app/storage/logs \
         /app/storage/app/public/screenshots \
         /app/bootstrap/cache
# optional: if you run as www-data in FPM, give it ownership
chown -R www-data:www-data /app/storage /app/bootstrap/cache || true
# permissive enough for containers
chmod -R ug+rwX /app/storage /app/bootstrap/cache
# Rendered share cards are written here by PHP-FPM (running as www-data)
chmod 777 /app/storage/app/public/screenshots

# Make sure nginx can write logs & pid (your nginx logs go elsewhere, but safe)
mkdir -p /var/log/nginx

# Storage symlink (idempotent)
php artisan storage:link || true

# If a previous build cached views with a missing dir, clear them safely
php artisan view:clear || true

# Run any outstanding migrations
php artisan migrate --force || true

# Optimize app (config, routes, events, views)
php artisan optimize

# Render nginx.conf from the template
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Pre-flight: test nginx config
nginx -t -c /etc/nginx.conf

# Start supervisor (nginx, php-fpm, inertia-ssr/horizon/scheduler)
exec supervisord -c /etc/supervisord.conf -n

'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-scheduler.conf" = '''
[program:worker-scheduler]
process_name=%(program_name)s
command=bash -c 'exec php /app/artisan schedule:work'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-scheduler.log
stderr_logfile=/var/log/worker-scheduler.log
'''

"worker-queue.conf" = '''
[program:worker-queue]
process_name=%(program_name)s
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-queue.log
stderr_logfile=/var/log/worker-queue.log
'''

"worker-telegram-queue.conf" = '''
[program:worker-telegram-queue]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --queue=telegram --sleep=1 --tries=1 --max-time=3600'
numprocs=4
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-telegram-queue.log
stderr_logfile=/var/log/worker-telegram-queue.log
'''

# Dedicated worker for AI jobs (LLM calls can be slow: --timeout=300).
# stopwaitsecs > timeout so supervisor lets in-flight AI jobs finish on restart.
"worker-ai-queue.conf" = '''
[program:worker-ai-queue]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --queue=ai --sleep=1 --tries=1 --timeout=300 --max-time=3600'
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=310
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-ai-queue.log
stderr_logfile=/var/log/worker-ai-queue.log
'''

# Interactive assistant turns (config/ai.php `chat.queue`) — the resumable
# TurnBuffer path, for both the student and the admin surface.
#
# Separate from the `ai` queue above on purpose: that one carries multi-minute
# corpus extraction and ingestion, and a visitor watching an SSE stream must
# never be queued behind a document ingest. Equally not `default`, which is one
# worker with no --timeout: turns would serialize behind each other, block every
# other default-queue job, and die at 60s.
#
# --tries=1 because a half-streamed turn must never silently replay — the jobs'
# own failed() hook writes the terminal error frame instead, so a killed turn
# ends the client's stream rather than leaving it to spin. --sleep=1 keeps
# pickup latency out of the visible reply. --timeout=300 matches the AI worker
# and is the CEILING, not a preference: config/queue.php pins redis retry_after
# at 360, which must stay above the longest a job may run or a still-streaming
# turn is reclaimed and run a second time. numprocs=2 so two visitors' turns do
# not serialize; stopwaitsecs > timeout lets an in-flight turn finish a restart.
"worker-ai-chat.conf" = '''
[program:worker-ai-chat]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --queue=ai-chat --sleep=1 --tries=1 --timeout=300 --max-time=3600'
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=310
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-ai-chat.log
stderr_logfile=/var/log/worker-ai-chat.log
'''

"worker-inertia-ssr.conf" = '''
[program:inertia-ssr]
command=bash -c 'exec php /app/artisan inertia:start-ssr'
autostart=true
autorestart=true
stderr_logfile=/var/log/worker-inertia-ssr.log
stdout_logfile=/var/log/worker-inertia-ssr.log
'''

"worker-telegram-bot.conf" = '''
[program:telegram-bot]
command=bash -c 'exec php /app/artisan telegram:run'
process_name=%(program_name)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-telegram-bot.log
stderr_logfile=/var/log/worker-telegram-bot.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=3600
environment=NODE_BINARY="%(ENV_NODE_BINARY)s"
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no

; Useful production tweaks
php_admin_value[memory_limit] = 512M
; Long enough for a streamed AI turn (SSE): reasoning models plus tool
; calls can run well past a minute before the reply completes. nginx's
; fastcgi_read_timeout is raised to match.
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 60
php_admin_value[post_max_size] = 256M
php_admin_value[upload_max_filesize] = 64M

; OPcache
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.memory_consumption] = 128

; The Node interpreter the image renderer runs scripts/takumi-render.mjs with
env[NODE_BINARY] = $NODE_BINARY
; Node wants a writable HOME
env[HOME] = /tmp
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
    include    $!{nginx}/conf/mime.types;
    index      index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )

        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 35M;

        index index.php;
        charset utf-8;

        $if(NIXPACKS_PHP_FALLBACK_PATH) (
            location / {
                try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
            }
        ) else (
          location / {
                try_files $uri $uri/ /index.php?$query_string;
           }
        )

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Laravel friendly 404
        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;

            # Inertia-specific buffer tweak
            fastcgi_buffer_size 8k;

            # AI chat replies stream as SSE: the controllers send
            # "X-Accel-Buffering: no" so nginx flushes each token frame
            # instead of buffering the whole response. The long read timeout
            # lets a slow turn (reasoning model thinking before the first
            # token, or a multi-step tool call) finish without nginx killing
            # the connection at the default 60s and truncating the reply.
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''

; Process tree for the Railpack image, started by /start-container.sh.
; FrankenPHP serves HTTP (it replaces nginx + php-fpm); the rest mirror the old
; nixpacks supervisor programs. Everything runs as root, as FrankenPHP does.
;
; Stop order: Docker SIGKILLs the container 30s after SIGTERM, so no program
; gets more than 25s to drain (the old 310s and 3600s never held).
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
nodaemon=true
user=root
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:frankenphp]
; Lowest priority number = started first and STOPPED LAST. During a rolling
; deploy the old container stays in Traefik's pool until it exits, so the web
; server must keep answering while the workers drain (s-grade measured half
; its requests turning into 502s for ~30s with the web server stopped first).
priority=10
command=frankenphp run --config /Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
; SIGTERM closes the listener at once, but FrankenPHP then waits for every
; running PHP request (Caddy's grace_period cannot cut one), so an open SSE
; stream would keep the dead listener in Traefik's pool until Docker's 30s
; kill. The chat streams resume from their cursor on the new container, so
; 5s is enough.
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-scheduler]
; `schedule:run` once a minute from a shell loop instead of a resident
; `schedule:work` PHP process (see deploy/scheduler.sh).
command=/bin/bash /app/deploy/scheduler.sh
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/var/log/worker-scheduler.log
stderr_logfile=/var/log/worker-scheduler.log

[program:worker-queue]
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/var/log/worker-queue.log
stderr_logfile=/var/log/worker-queue.log

[program:worker-telegram-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=telegram --sleep=1 --tries=1 --max-time=3600
directory=/app
numprocs=4
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/var/log/worker-telegram-queue.log
stderr_logfile=/var/log/worker-telegram-queue.log

; Dedicated worker for AI jobs (LLM calls can be slow: --timeout=300).
; A job still running when the container stops is killed after 25s; with
; --tries=1 it then fails once redis retry_after (360s) reclaims it.
[program:worker-ai-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=ai --sleep=1 --tries=1 --timeout=300 --max-time=3600
directory=/app
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/var/log/worker-ai-queue.log
stderr_logfile=/var/log/worker-ai-queue.log

; Interactive assistant turns (config/ai.php `chat.queue`) — the resumable
; TurnBuffer path, for both the student and the admin surface.
;
; Separate from the `ai` queue above on purpose: that one carries multi-minute
; corpus extraction and ingestion, and a visitor watching an SSE stream must
; never be queued behind a document ingest. Equally not `default`, which is one
; worker with no --timeout: turns would serialize behind each other, block every
; other default-queue job, and die at 60s.
;
; --tries=1 because a half-streamed turn must never silently replay — the jobs'
; own failed() hook writes the terminal error frame instead, so a killed turn
; ends the client's stream rather than leaving it to spin. --sleep=1 keeps
; pickup latency out of the visible reply. --timeout=300 matches the AI worker
; and is the CEILING, not a preference: config/queue.php pins redis retry_after
; at 360, which must stay above the longest a job may run or a still-streaming
; turn is reclaimed and run a second time. numprocs=2 so two visitors' turns do
; not serialize. A turn still running when the container stops gets 25s to
; finish (Docker kills at 30s); past that it is killed, and failed() ends the
; client's stream once retry_after reclaims the job.
[program:worker-ai-chat]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=ai-chat --sleep=1 --tries=1 --timeout=300 --max-time=3600
directory=/app
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/var/log/worker-ai-chat.log
stderr_logfile=/var/log/worker-ai-chat.log

; Inertia SSR on 127.0.0.1:13714, run directly rather than through
; `artisan inertia:start-ssr` (one PHP process less). resources/js/ssr.ts
; runs it as a single process (no cluster). Laravel falls back to client
; rendering whenever it is down.
[program:inertia-ssr]
command=node /app/bootstrap/ssr/ssr.js
directory=/app
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/var/log/worker-inertia-ssr.log
stderr_logfile=/var/log/worker-inertia-ssr.log

; Long-polls Telegram for updates and dispatches them to the telegram queue.
[program:telegram-bot]
command=php /app/artisan telegram:run
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/var/log/worker-telegram-bot.log
stderr_logfile=/var/log/worker-telegram-bot.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

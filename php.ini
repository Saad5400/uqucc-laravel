; Loaded by Railpack as /usr/local/etc/php/conf.d/php.ini (replaces Railpack's
; default). Values mirror the old Nixpacks php-fpm pool.
[PHP]
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
variables_order = "EGPCS"

; SSE: AI replies are flushed frame by frame (Saad\AiKit\Streaming\SseStream).
; No output buffer, so each echo + flush() reaches the client at once.
output_buffering = Off
implicit_flush = Off
zlib.output_compression = Off

memory_limit = 512M
; The Caddyfile caps request bodies at 35MB (nginx's old client_max_body_size),
; so php-fpm's 256M / 64M could never be reached; these are the effective
; limits. The largest upload the app validates is 20MB (corpus documents).
post_max_size = 35M
upload_max_filesize = 32M
max_file_uploads = 20
; FrankenPHP is a ZTS build, where max_execution_time is WALL-CLOCK time
; (php-fpm counted CPU time, so its 300s never fired on a request waiting on
; the network). The stream tails raise their own limit to 210s through
; SseStream::extendTimeLimit; everything else, inline model calls included
; (the longest client timeout is 180s), fits under 360s. CLI (queue,
; scheduler, bot) is always unlimited.
max_execution_time = 360
max_input_time = 60

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image is immutable and start-container.sh writes every cache file
; before FrankenPHP starts, as under php-fpm.
opcache.validate_timestamps = 0
